on:
  workflow_dispatch:
  push:
    branches:
      - main

name: 🚀 Deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # A project site is served from https://<user>.github.io/<repo>/, so every asset path needs
      # that prefix. `vite dev`/`vite preview` keep an empty base so the loopback local-config
      # bridge is unaffected.
      - name: 🏗️ Build (base path for project pages)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

      # Without this, GitHub Pages runs Jekyll and drops everything starting with an underscore —
      # which is the entire `_app` directory.
      - name: 🚫 Disable Jekyll
        run: touch build/.nojekyll

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: 🌐 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
